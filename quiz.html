<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 แบบทดสอบเตรียมสอบแลปโครงสร้างผลึก 3D (Crystal Lab Quiz)</title>
    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: rgba(15, 23, 42, 0.95);
            --border-color: rgba(56, 189, 248, 0.25);
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Kanit', Prompt, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover {
            background: var(--accent-blue);
            color: white;
        }

        /* Filter Pills */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-cyan);
        }

        /* Quiz Box */
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.88rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            padding-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.15rem;
            color: #f8fafc;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            padding: 12px 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .opt-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
            transform: translateX(4px);
        }

        .opt-btn .opt-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1e293b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            font-weight: bold;
            color: var(--accent-cyan);
            flex-shrink: 0;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: #10b981 !important;
            color: #a7f3d0 !important;
        }

        .opt-btn.wrong {
            background: rgba(244, 63, 94, 0.25) !important;
            border-color: #f43f5e !important;
            color: #fecaca !important;
        }

        .feedback-box {
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .feedback-box.correct {
            background: rgba(16, 185, 129, 0.15);
            border-left: 4px solid #10b981;
            color: #a7f3d0;
        }

        .feedback-box.wrong {
            background: rgba(244, 63, 94, 0.15);
            border-left: 4px solid #f43f5e;
            color: #fecaca;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 6px;
        }

        .btn-action {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid #38bdf8;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        /* Result Card */
        .result-card {
            display: none;
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            flex-direction: column;
            gap: 16px;
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🧪 Crystal Lab Quiz</h1>
                <p style="color:var(--text-secondary); font-size:0.85rem; margin-top:4px;">แบบทดสอบทบทวนความรู้แลปโครงสร้างผลึกและเคมีสถานะของแข็ง</p>
            </div>
            <div class="nav-links">
                <a href="dammm.html"><span>🎮</span><span>กลับสู่ 3D Simulator</span></a>
            </div>
        </header>

        <!-- Category Filters -->
        <div class="filter-bar">
            <button class="filter-btn active" data-cat="all">ทั้งหมด (12 ข้อ)</button>
            <button class="filter-btn" data-cat="packing">การเรียงชิดที่สุด (Closest Packing)</button>
            <button class="filter-btn" data-cat="holes">ชนิดช่องว่าง (Voids)</button>
            <button class="filter-btn" data-cat="unitcells">ยูนิตเซลล์โลหะ</button>
            <button class="filter-btn" data-cat="ionic">สารประกอบไอออนิก</button>
        </div>

        <!-- Quiz Container -->
        <div class="quiz-card" id="quizCard">
            <div class="quiz-meta">
                <span id="quizIndexText">ข้อที่ 1 / 12</span>
                <span id="quizCategoryBadge" style="color:var(--accent-cyan);">หมวด: ทั้งหมด</span>
                <span id="quizScoreText" style="color:var(--accent-emerald); font-weight:bold;">คะแนน: 0</span>
            </div>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="question-text" id="questionText">กำลังโหลดคำถาม...</div>

            <div class="options-list" id="optionsList"></div>

            <div class="feedback-box" id="feedbackBox"></div>

            <div class="action-row">
                <button class="btn-action" id="btnNext" style="display:none;">ข้อถัดไป ➔</button>
            </div>
        </div>

        <!-- Result Summary -->
        <div class="result-card" id="resultCard">
            <h2 style="font-size:1.6rem; color:var(--text-primary);">🎉 สรุปผลการทดสอบ</h2>
            <div class="score-big" id="finalScore">0 / 12</div>
            <p id="gradeComment" style="font-size:1.1rem; color:#cbd5e1;"></p>
            <div style="display:flex; justify-content:center; gap:12px; margin-top:10px;">
                <button class="btn-action" id="btnRestart">ทำใหม่อีกครั้ง 🔄</button>
                <a href="dammm.html" class="btn-action" style="text-decoration:none; display:inline-flex; align-items:center;">ไปยัง 3D Simulator ➔</a>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                cat: "packing",
                q: "1. การจัดเรียงอนุภาค 1 ชั้นแบบ Closest Packing (เรียงสับหว่าง) มีพื้นที่ว่างคิดเป็นกี่เปอร์เซ็นต์?",
                options: ["25.92%", "39.52%", "47.62%", "52.38%"],
                ans: 1,
                exp: "ในการเรียงอนุภาค 1 ชั้นแบบ Closest Packing จะมีความหนาแน่น 60.48% ทำให้มีพื้นที่ว่างเท่ากับ 100 - 60.48 = 39.52% (ในขณะที่ Simple Cubic มีพื้นที่ว่าง 47.62%)"
            },
            {
                cat: "packing",
                q: "2. ในการเรียงลูกปิงปองแบบ HCP (Hexagonal Close-Packed) ลำดับการซ้อนทับชั้นเป็นแบบใด?",
                options: ["AAAA...", "ABABAB...", "ABCABC...", "ABACABAC..."],
                ans: 1,
                exp: "HCP มีลำดับการเรียงชั้นแบบ ABABAB... โดยลูกปิงปองในชั้นที่ 3 จะวางตรงกับตำแหน่งของชั้นที่ 1 พอดี"
            },
            {
                cat: "packing",
                q: "3. ในการเรียงลูกปิงปองแบบ FCC (Face-Centred Cubic) ชั้นที่ 3 จะวางตัวในตำแหน่งใดเมื่อเทียบกับชั้นที่ 1 และ 2?",
                options: [
                    "วางตรงกับลูกปิงปองในชั้นที่ 1 พอดี",
                    "วางตรงกับช่องว่าง Tetrahedral ของชั้น 1-2",
                    "วางตรงกับช่องว่าง Octahedral (รอยบุ๋ม C) ไม่ทับชั้นที่ 1 หรือ 2",
                    "วางทับแนวระหว่างชั้นแบบสุ่ม"
                ],
                ans: 2,
                exp: "FCC เรียงแบบ ABCABC... โดยชั้นที่ 3 (C) จะวางบนช่องว่าง Octahedral ซึ่งเป็นรอยบุ๋มที่ทะลุถึงด้านล่าง ทำให้มองจากด้านบนไม่ทับกับชั้น 1 หรือ 2"
            },
            {
                cat: "holes",
                q: "4. อัตราส่วนรัศมีของช่องว่างต่อรัศมีทรงกลม (r_void / R) สำหรับช่องเททระฮีดรัล (Tetrahedral void) มีค่าประมาณเท่าใด?",
                options: ["0.155", "0.225", "0.414", "0.732"],
                ans: 1,
                exp: "ช่อง Tetrahedral เกิดจากทรงกลม 4 ลูกล้อมรอบ มีอัตราส่วนรัศมี r/R = (√(3/2) - 1) ≈ 0.225"
            },
            {
                cat: "holes",
                q: "5. ช่องออกตะฮีดรัล (Octahedral void) เกิดจากทรงกลมกี่ลูกล้อมรอบ และมีอัตราส่วนรัศมี r_void / R เท่าใด?",
                options: [
                    "4 ลูก, r/R = 0.225",
                    "6 ลูก, r/R = 0.414",
                    "8 ลูก, r/R = 0.732",
                    "12 ลูก, r/R = 1.000"
                ],
                ans: 1,
                exp: "ช่อง Octahedral เกิดจากทรงกลม 6 ลูก (3 ลูกล่างและ 3 ลูกบนคว่ำสลับกัน) มีอัตราส่วนรัศมี r/R = (√2 - 1) ≈ 0.414"
            },
            {
                cat: "holes",
                q: "6. ถ้าผลึกมีอะตอมจัดเรียงแบบชิดที่สุดจำนวน N อะตอม จะมีจำนวนช่อง Tetrahedral และ Octahedral อย่างละกี่ช่อง?",
                options: [
                    "Tetrahedral = N, Octahedral = N",
                    "Tetrahedral = 2N, Octahedral = N",
                    "Tetrahedral = N, Octahedral = 2N",
                    "Tetrahedral = 4N, Octahedral = 2N"
                ],
                ans: 1,
                exp: "ในโครงสร้าง Closest-packed ทุกๆ 1 อนุภาคทรงกลม จะเกิดช่อง Tetrahedral 2 ช่อง (รวม 2N) และช่อง Octahedral 1 ช่อง (รวม N)"
            },
            {
                cat: "unitcells",
                q: "7. อะตอมที่อยู่ที่ 'มุม' (Corner) ของลูกบาศก์ยูนิตเซลล์ จะถูกแชร์ร่วมกับยูนิตเซลล์ข้างเคียงกี่เซลล์ และนับเป็นสัดส่วนเท่าใดในหนึ่งเซลล์?",
                options: [
                    "แชร์ 2 เซลล์, นับเป็น 1/2",
                    "แชร์ 4 เซลล์, นับเป็น 1/4",
                    "แชร์ 8 เซลล์, นับเป็น 1/8",
                    "แชร์ 12 เซลล์, นับเป็น 1/12"
                ],
                ans: 2,
                exp: "มุมของลูกบาศก์จะบรรจบกัน 8 เซลล์ (4 เซลล์ชั้นล่าง + 4 เซลล์ชั้นบน) จึงนับเป็น 1/8 อะตอมต่อยูนิตเซลล์"
            },
            {
                cat: "unitcells",
                q: "8. ยูนิตเซลล์แบบ Body-Centred Cubic (BCC) มีจำนวนอะตอมสุทธิต่อยูนิตเซลล์เท่ากับกี่อะตอม?",
                options: ["1 อะตอม", "2 อะตอม", "4 อะตอม", "6 อะตอม"],
                ans: 1,
                exp: "BCC มีอะตอมที่มุม 8 จุด: 8 × (1/8) = 1 อะตอม และอะตอมใจกลาง 1 อะตอมเต็ม รวมสุทธิ = 1 + 1 = 2 อะตอมต่อยูนิตเซลล์"
            },
            {
                cat: "unitcells",
                q: "9. ในยูนิตเซลล์แบบ Face-Centred Cubic (FCC) อะตอมสัมผัสกันตามแนวใด และมีความสัมพันธ์ระหว่างขอบเซลล์ a กับรัศมี r อย่างไร?",
                options: [
                    "สัมผัสตามแนวขอบ: a = 2r",
                    "สัมผัสตามแนวทแยงมุมหน้า (Face diagonal): 4r = a√2",
                    "สัมผัสตามแนวทแยงมุมใหญ่ (Body diagonal): 4r = a√3",
                    "ไม่สัมผัสกันโดยตรง"
                ],
                ans: 1,
                exp: "ใน FCC อะตอมที่มุมจะสัมผัสกับอะตอมกึ่งกลางหน้าตามแนวทแยงมุมของหน้าลูกบาศก์ (ความยาวแนวทแยง = a√2) จึงได้ 4r = a√2 หรือ a = 2√2 r"
            },
            {
                cat: "ionic",
                q: "10. ในโครงสร้างผลึกของเกลือแกง (NaCl) ไอออน Na⁺ บรรจุอยู่ในช่องว่างชนิดใดของโครงร่างผลึก Cl⁻?",
                options: [
                    "ช่องว่าง Tetrahedral ทั้งหมด",
                    "ช่องว่าง Tetrahedral ครึ่งเดียว",
                    "ช่องว่าง Octahedral ทั้งหมด (100%)",
                    "ช่องว่าง Cubic"
                ],
                ans: 2,
                exp: "NaCl มี Cl⁻ จัดเรียงแบบ FCC (มี 4 Cl⁻) และ Na⁺ บรรจุในช่อง Octahedral ทั้งหมด (ที่ใจกลาง 1 ลูก และที่กึ่งกลางขอบ 12 × 1/4 = 3 ลูก รวมเป็น 4 Na⁺) อัตราส่วน 1:1"
            },
            {
                cat: "ionic",
                q: "11. ผลึกฟลูออไรต์ (CaF₂) มีโครงสร้างแบบใด และมีอัตราส่วนเลขโคออร์ดิเนชัน (CN) ของ Ca²⁺ : F⁻ เป็นเท่าใด?",
                options: [
                    "Ca²⁺ เป็น FCC, F⁻ ในช่อง Tetrahedral ครบทั้ง 8 ช่อง, CN = 8 : 4",
                    "Ca²⁺ เป็น SC, F⁻ ในช่อง Cubic, CN = 8 : 8",
                    "Ca²⁺ เป็น FCC, F⁻ ในช่อง Octahedral, CN = 6 : 6",
                    "Ca²⁺ เป็น BCC, F⁻ ในช่อง Tetrahedral ครึ่งเดียว, CN = 4 : 4"
                ],
                ans: 0,
                exp: "CaF₂ มี Ca²⁺ จัดแบบ FCC (4 ไอออน) และ F⁻ บรรจุในช่อง Tetrahedral ครบทั้ง 8 ช่อง ทำให้ Ca²⁺ ถูกล้อมรอบด้วย 8 F⁻ (CN=8) และ F⁻ ถูกล้อมรอบด้วย 4 Ca²⁺ (CN=4)"
            },
            {
                cat: "ionic",
                q: "12. เทคนิคการเลี้ยวเบนรังสีเอกซ์ (X-ray Diffraction: XRD) อาศัยกฎใดในการหาค่าระยะห่างระหว่างระนาบผลึก (d)?",
                options: [
                    "กฎของบอยล์ (PV = k)",
                    "กฎของแบร็กก์ (nλ = 2d sinθ)",
                    "สมการชเรอดิงเงอร์ (Hψ = Eψ)",
                    "กฎการแพร่ของเกรแฮม"
                ],
                ans: 1,
                exp: "กฎของแบร็กก์ (Bragg's Law): nλ = 2d sinθ เป็นสมการหลักที่อธิบายการแทรกสอดเสริมกันของรังสีเอกซ์ที่เลี้ยวเบนจากระนาบอะตอมในผลึก"
            }
        ];

        let filteredList = [...allQuestions];
        let curIdx = 0;
        let score = 0;

        const quizCard = document.getElementById('quizCard');
        const resultCard = document.getElementById('resultCard');
        const questionText = document.getElementById('questionText');
        const optionsList = document.getElementById('optionsList');
        const feedbackBox = document.getElementById('feedbackBox');
        const btnNext = document.getElementById('btnNext');
        const progressBar = document.getElementById('progressBar');
        const quizIndexText = document.getElementById('quizIndexText');
        const quizScoreText = document.getElementById('quizScoreText');
        const quizCategoryBadge = document.getElementById('quizCategoryBadge');

        function loadQuestion() {
            if (curIdx >= filteredList.length) {
                showResult();
                return;
            }

            const item = filteredList[curIdx];
            quizIndexText.textContent = `ข้อที่ ${curIdx + 1} / ${filteredList.length}`;
            quizScoreText.textContent = `คะแนน: ${score}`;
            progressBar.style.width = `${((curIdx) / filteredList.length) * 100}%`;

            const catMap = {
                'packing': 'การเรียงชิดที่สุด',
                'holes': 'ชนิดช่องว่าง',
                'unitcells': 'ยูนิตเซลล์โลหะ',
                'ionic': 'สารประกอบไอออนิก'
            };
            quizCategoryBadge.textContent = `หมวด: ${catMap[item.cat] || 'ทั่วไป'}`;

            questionText.textContent = item.q;
            optionsList.innerHTML = '';
            feedbackBox.style.display = 'none';
            btnNext.style.display = 'none';

            const letters = ['ก', 'ข', 'ค', 'ง'];

            item.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerHTML = `<span class="opt-badge">${letters[idx]}</span><span>${opt}</span>`;
                btn.addEventListener('click', () => {
                    const allOpts = optionsList.querySelectorAll('.opt-btn');
                    allOpts.forEach(b => b.disabled = true);

                    if (idx === item.ans) {
                        score++;
                        btn.classList.add('correct');
                        feedbackBox.className = 'feedback-box correct';
                        feedbackBox.innerHTML = `<b>🎉 ถูกต้อง!</b><br>${item.exp}`;
                    } else {
                        btn.classList.add('wrong');
                        allOpts[item.ans].classList.add('correct');
                        feedbackBox.className = 'feedback-box wrong';
                        feedbackBox.innerHTML = `<b>❌ ยังไม่ถูกต้อง</b> คำตอบที่ถูกต้องคือข้อ ${letters[item.ans]}<br>${item.exp}`;
                    }
                    feedbackBox.style.display = 'block';
                    quizScoreText.textContent = `คะแนน: ${score}`;
                    btnNext.style.display = 'inline-block';
                });
                optionsList.appendChild(btn);
            });
        }

        btnNext.addEventListener('click', () => {
            curIdx++;
            loadQuestion();
        });

        function showResult() {
            quizCard.style.display = 'none';
            resultCard.style.display = 'flex';
            progressBar.style.width = '100%';
            document.getElementById('finalScore').textContent = `${score} / ${filteredList.length}`;

            const percent = (score / filteredList.length) * 100;
            let comment = '';
            if (percent === 100) comment = '🏆 ยอดเยี่ยมระดับเกียรตินิยม! คุณเข้าใจโครงสร้างผลึกและแลปเรียงลูกปิงปองอย่างสมบูรณ์แบบ';
            else if (percent >= 80) comment = '🌟 ดีมาก! คุณมีความรู้ความเข้าใจในเนื้อหาแลปอย่างแม่นยำ พร้อมทำข้อสอบแลปได้สบาย';
            else if (percent >= 50) comment = '👍 ผ่านเกณฑ์! ทบทวนเพิ่มเติมในส่วนชนิดช่องว่างและยูนิตเซลล์อีกนิดจะยอดเยี่ยมยิ่งขึ้น';
            else comment = '💡 ลองกลับไปศึกษาในโมเดล 3D และเปิดดูสรุปเนื้อหาแลปใน Simulator แล้วมาลองทำใหม่อีกครั้งนะ!';
            document.getElementById('gradeComment').textContent = comment;
        }

        document.getElementById('btnRestart').addEventListener('click', () => {
            curIdx = 0;
            score = 0;
            quizCard.style.display = 'flex';
            resultCard.style.display = 'none';
            loadQuestion();
        });

        // Filter Handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const cat = btn.getAttribute('data-cat');
                if (cat === 'all') {
                    filteredList = [...allQuestions];
                } else {
                    filteredList = allQuestions.filter(q => q.cat === cat);
                }
                curIdx = 0;
                score = 0;
                quizCard.style.display = 'flex';
                resultCard.style.display = 'none';
                loadQuestion();
            });
        });

        loadQuestion();
    </script>
</body>
</html>
